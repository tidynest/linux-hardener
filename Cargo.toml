[workspace]
resolver = "2"
members = [
    "crates/hardener-cli",
    "crates/hardener-common",
    "crates/hardener-compliance",
    "crates/hardener-core",
    "crates/hardener-distro",
    "crates/hardener-plugins",
    "crates/hardener-scheduler",
    "crates/hardener-state",
    "crates/hardener-types",
    "crates/hardener-ui",
    "src-tauri",
]

[workspace.package]
version = "1.8.1"
authors = ["Eric Jingryd"]
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/tidynest/linux-hardener"

[workspace.dependencies]

# Async & Error handling
anyhow = "1.0.100"
async-trait = "0.1.89"
futures = "0.3.31"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }

# CLI
clap = { version = "4.5.53", features = ["derive"] }

# Configuration
config = "0.15.18"
dirs = "6.0.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde-wasm-bindgen = "0.6.5"
toml = "0.9.8"
toml_edit = "0.22"

# Internal workspace crates
hardener-common = { path = "crates/hardener-common" }
hardener-compliance = { path = "crates/hardener-compliance" }
hardener-core = { path = "crates/hardener-core", default-features = false }
hardener-distro = { path = "crates/hardener-distro" }
hardener-plugins = { path = "crates/hardener-plugins" }
hardener-scheduler = { path = "crates/hardener-scheduler"}
hardener-state = { path = "crates/hardener-state" }
hardener-types = { path = "crates/hardener-types" }
hardener-ui = { path = "crates/hardener-ui" }

# Date/time
chrono = "0.4.42"

# Logging
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }

# Plugin system
petgraph = "0.8.3"  # Graph data structures for plugin dependency resolution

# Security
argon2 = "0.5.3"
ed25519-dalek = "2.2.0"
ring = "0.17.14"

# State management
sqlx = { version = "0.8.6", default-features = false, features = ["migrate", "runtime-tokio-rustls", "sqlite"] }

# System interaction
hostname = "0.4.1"
nix = { version = "0.30.1", features = ["process", "user"] }
openssh = "0.11.5"
procfs = "0.18.0"
sysinfo = "0.37.2"
tempfile = "3.23.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
