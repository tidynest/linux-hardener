name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Exclude GUI crates that require GTK/system libraries
  WORKSPACE_EXCLUDE: --exclude linux-hardener-desktop --exclude hardener-ui

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run cargo check
        run: cargo check --workspace $WORKSPACE_EXCLUDE

  # The one invocation that builds the whole workspace at once, GUI crates
  # included. Every other job that tests or checks carries WORKSPACE_EXCLUDE,
  # so through late August 2026 the unified feature graph was built by no job
  # at all: this job tested the headless crates, the desktop job tested the
  # desktop crate against its own selection, and both were green while the
  # one build a developer runs locally, `cargo test --workspace`, was never
  # executed by CI. Feature unification across every member at once is
  # precisely where a test-support or feature-gating mistake surfaces, which
  # is why this job pays for the GTK libraries and the frontend bundle rather
  # than excluding them: closing the desktop gap as a separate job looked
  # complete and was not quite.
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # The desktop crate links GTK and WebKitGTK, and its embedded frontend
      # bundle must exist before it compiles: same prerequisites as the
      # desktop job, for the same reasons its comment block records.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev

      - name: Install trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-test-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-test-cargo-

      - name: Build the frontend bundle the backend embeds
        run: trunk build --release
        working-directory: crates/hardener-ui

      - name: Run tests
        run: cargo test --workspace

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run clippy
        run: cargo clippy --workspace $WORKSPACE_EXCLUDE -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A prebuilt binary rather than `cargo install cargo-audit`, which
      # compiled the tool from source on every run: minutes of unpinned
      # work whose failure mode was the retry loop this step used to carry.
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Run security audit
        run: cargo audit

  wasm-check:
    name: WASM Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-wasm-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-wasm-cargo-

      - name: Check WASM compilation
        run: cargo check -p hardener-ui --target wasm32-unknown-unknown

      # Nowhere else lints this crate: the workspace clippy job carries
      # WORKSPACE_EXCLUDE, so without this step a warning the frontend
      # compiles with ships. Verified clean before the step was added, so
      # the gate starts strict rather than landing red.
      - name: Lint the frontend crate
        run: cargo clippy -p hardener-ui --target wasm32-unknown-unknown -- -D warnings

  # Compiles and lints the desktop backend, which the check and clippy jobs
  # cannot touch: they carry WORKSPACE_EXCLUDE for want of the GTK and
  # WebKitGTK system libraries, so through late August 2026 a tree where
  # `commands.rs` stopped compiling passed this workflow green, and only a
  # developer's local `cargo clippy --workspace` stood in the gap. Installing
  # those libraries is the whole difference between this job and the exclude.
  # Clippy with `-D warnings` runs here because no other job lints this crate.
  #
  # The desktop crate's TESTS run in the test job's single
  # `cargo test --workspace` invocation, which builds the unified feature
  # graph this crate's own `-p` selection never did: unification over every
  # workspace member is a superset of unification over this crate's
  # dependency graph, so the tests run against at least the features they ran
  # against before, in the one configuration a developer runs locally.
  #
  # The frontend bundle is built first, because `tauri::generate_context!`
  # embeds `frontendDist` at compile time and a checkout carries no `dist/`
  # (Trunk generates it, and it is gitignored): without this step the check
  # fails with `frontendDist ... doesn't exist`, which is how the job's need
  # for it was established rather than assumed. Building the real bundle
  # rather than stubbing the directory also gives CI its only execution of
  # `trunk build`, which the wasm-check job's `cargo check` does not
  # exercise.
  desktop:
    name: Desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev

      - name: Install trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-desktop-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-desktop-cargo-

      - name: Build the frontend bundle the backend embeds
        run: trunk build --release
        working-directory: crates/hardener-ui

      - name: Check the desktop backend
        run: cargo check -p linux-hardener-desktop --all-targets

      - name: Lint the desktop backend
        run: cargo clippy -p linux-hardener-desktop --all-targets -- -D warnings

  # Runs the ignored-by-default integration tests that need root, which
  # otherwise run only inside the local cross-distro containers: those are
  # booted systemd environments built by hand, so a plain regression could
  # sit in a root-only apply path between container runs and nothing in CI
  # would see it. Curated to the tests that operate on files a stock
  # ubuntu-latest runner carries (sysctl.d, sshd_config, PAM stacks,
  # permission modes); the services, audit, MAC and firewall tests are left
  # out because they need a booted systemd, an audit-capable kernel, a MAC
  # system or a specific firewall backend, and ssh_integration is left out
  # because it needs a live SSH host. Widen the filter only after a green
  # run of what is here.
  #
  # The build runs as root into its own target directory: the default
  # target/ belongs to the unprivileged jobs, and root-owned artefacts in
  # it would poison every later cache hit.
  root-tests:
    name: Root-Gated Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # The SSH root test's apply path validates the hardened configuration
      # through the sshd binary. Stock runners carry the client only, so
      # without the server package every change reports failed and the test
      # panics at "All changes should succeed with root privileges" - the
      # same precondition the distro containers satisfy for the cross-distro
      # suite. The postinst generates the host keys the validator reads.
      - name: Install openssh-server for the SSH root test
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server
          # The privilege-separation directory sshd -t requires. It is
          # created by the service starting, which a fresh install never
          # does, and without it every `sshd -t` fails with "Missing
          # privilege separation directory: /run/sshd" - which the plugin's
          # apply validation reads as a failed change.
          sudo mkdir -p /run/sshd

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target-root
          key: ${{ runner.os }}-root-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-root-cargo-

      # cargo test with explicit --test selection rather than nextest's
      # filter DSL: each of these four integration binaries holds exactly
      # one ignored root-gated test, and `-- --ignored` runs only those,
      # which is the whole curation. The other ignored tests live in other
      # binaries and are never loaded here.
      # RUSTUP_HOME travels with CARGO_HOME because sudo strips the
      # environment: without it the rustup proxy runs as root, looks in
      # /root/.rustup, and dies with "no default is configured". The
      # variables expand in the step shell before sudo sees them.
      - name: Run the root-gated integration tests
        run: |
          sudo env PATH="$PATH" \
            CARGO_HOME="$HOME/.cargo" \
            RUSTUP_HOME="$HOME/.rustup" \
            RUSTUP_TOOLCHAIN=stable \
            CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target-root" \
            cargo test -p hardener-plugins --locked \
              --test kernel_tests --test permissions_tests \
              --test pam_tests --test ssh_tests -- --ignored

      - name: Fix target directory ownership
        run: sudo chown -R "$(id -u):$(id -g)" target-root

  # Builds the fuzz targets rather than running them: proving they compile
  # under the sanitizer flags is what rots silently, because nothing else in
  # this workflow touches nightly at all, and a target that stopped building
  # would otherwise sit unnoticed until someone wanted it in a crisis. The
  # targets assert documented invariants of the directive parsers apply
  # writes through, which consume files arriving from remote hosts over the
  # SSH executor - input the operator does not control.
  fuzz-build:
    name: Fuzz Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fuzz/target
          key: ${{ runner.os }}-fuzz-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-fuzz-cargo-

      # The gnu target is named explicitly because cargo-fuzz otherwise
      # picked musl on the runner, where the address sanitizer is
      # incompatible with statically linked libc.
      - name: Build the fuzz targets
        run: cargo fuzz build --target x86_64-unknown-linux-gnu
        working-directory: fuzz

  # Builds on the version `rust-version` declares, which no other job does: every
  # one of them installs @stable, so a tree that quietly starts requiring a newer
  # release compiles everywhere in CI and fails only for the person on the floor.
  # That is not hypothetical. The declaration read 1.85 from 2026-02 until
  # 2026-08-05 while the tree needed 1.88 for let-chains, and nothing reported it.
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Read rather than repeated, so raising the floor stays a one-line change
      # in Cargo.toml and this job cannot drift away from what is declared.
      - name: Read the declared minimum
        id: msrv
        run: |
          version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          # Constrained before it is used, because on a pull request from a fork
          # Cargo.toml is the contributor's file and this value reaches
          # `rustup toolchain install`. A version is digits and dots, nothing else.
          echo "$version" | grep -qE '^[0-9]+(\.[0-9]+){1,2}$' || {
            echo "rust-version in Cargo.toml is not a version: '$version'" >&2
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "declared minimum: $version"

      - name: Install the declared toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-msrv-${{ steps.msrv.outputs.version }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-msrv-${{ steps.msrv.outputs.version }}-cargo-

      # Same exclusions as the `check` job: the GUI crates need GTK system
      # libraries this runner does not carry, so their absence here is about the
      # runner rather than about the toolchain.
      - name: Check on the declared minimum
        run: cargo check --workspace --all-targets $WORKSPACE_EXCLUDE

  # Build the CLI binary for multiple platforms
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: hardener
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: hardener-musl

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p hardener-cli

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/hardener
