name: "CodeQL — security-relevant crates only"

# WASM/desktop glue cannot resolve under build-mode none (Leptos `view!` macros,
# `#[cfg(target_arch = "wasm32")]` bodies, Tauri `#[command]` macros, GTK FFI).
# Their unresolved calls drag the aggregate call-target metric below threshold
# without adding real coverage — neither is shipped attack surface. Mirror the
# `WORKSPACE_EXCLUDE` set in .github/workflows/ci.yml.
paths-ignore:
  - crates/hardener-ui
  - src-tauri
