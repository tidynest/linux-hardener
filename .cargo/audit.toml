# Audit configuration for cargo-audit
# This file documents known vulnerabilities that are accepted risks

[advisories]
# RUSTSEC-2023-0071: Marvin Attack on RSA timing sidechannels
# Status: No fix available
# Risk assessment: The rsa crate is pulled in transitively through sqlx-mysql,
# but this project only uses SQLite (sqlx with sqlite feature). The vulnerable
# code path is not exercised. Additionally, this tool does not expose an RSA
# server that would be susceptible to network timing attacks.
#
# RUSTSEC-2024-0429: unsoundness in glib::VariantStrIter's Iterator impls
# Status: No fix reachable. First patched in glib 0.20.0, but every released
# member of the tauri stack still requires the gtk-rs 0.18 generation (tauri
# 2.11.5, wry 0.56.1, tao 0.37.0, muda 0.19.3 and webkit2gtk 2.0.2 all
# require gtk ^0.18 / glib ^0.18), and cargo cannot cross a 0.x minor
# boundary while any of them does. Revisit when tauri moves to gtk-rs 0.20
# or newer.
# Risk assessment: glib is purely transitive here, pulled by the webview
# layer. This tree contains no direct glib usage and no VariantStrIter call
# site, so the unsound iterator is never exercised.
#
# RUSTSEC-2026-0459: libsqlite3-sys bundles a SQLite whose write-ahead-log
# reader can return uninitialised memory (CVE-2026-119375, SQLite < 3.54.0)
# Status: Fixed upstream, and no released sqlx can take the fix. The binaries
# bundle SQLite 3.46.0 from libsqlite3-sys 0.30.1; 0.39.0 (SQLite 3.54.0) is
# the first fixed release. sqlx 0.8.6 requires libsqlite3-sys ^0.30.1, and
# sqlx 0.9.0, the newest on crates.io, requires >=0.30.1, <0.38.0.
# transact-rs/sqlx#4502 raised that bound to <0.40.0 on 2026-11-08 for the
# coming 0.9.1, which declares Rust 1.94. Tracked in #188.
# Revisit: as soon as a released sqlx accepts libsqlite3-sys 0.39 or later
# (the weekly Advisories workflow fails on the first one), and by 2027-01-31
# whatever happens, the date scripts/deps/watch-rustsec-2026-0459.sh holds.
# Risk assessment: the flaw is compiled in, not just listed. sqlx's sqlite
# feature turns on libsqlite3-sys/bundled, and both databases run in WAL
# mode. It needs the process to open a database and -wal pair that a less
# trusted party wrote. The checkpoint database, which holds the files that
# rollback restores, is always /var/lib/linux-hardener/checkpoints.db under
# root, in a root-owned directory with the file at 0600, or the caller's own
# data directory otherwise; no database is ever read over SSH. The scan
# history database is the gap, because a root run takes its [scheduler]
# storage.database_path from a config file the desktop user can write, in
# two ways. The desktop's deep scan hands the root CLI the --config chosen in
# the app, which may sit in the user's own ~/.config/linux-hardener. And a
# root run that keeps the user's HOME or XDG_CONFIG_HOME (sudo -E, or su
# without --login in a session that sets XDG_CONFIG_HOME) reads [scheduler]
# from that user's config.toml before /etc: load_scheduler_config does not
# skip the user config under root, as the main config loader does. Code
# running as that user could therefore choose, and plant, the pair a root
# scan opens. Whether stale memory could then be read back has not been
# tested. Smaller: a non-root CLI run whose account has no home at all (no
# XDG_DATA_HOME, no HOME, none in the passwd entry) keeps its checkpoint
# database in ./.linux-hardener under the working directory. Low exposure,
# not none.
ignore = [
    "RUSTSEC-2023-0071",
    "RUSTSEC-2024-0429",
    "RUSTSEC-2026-0459",
]
