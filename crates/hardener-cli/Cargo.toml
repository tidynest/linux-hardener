[package]
name = "hardener-cli"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line interface for Linux Hardener"
build = "../../scripts/build_identity.rs"

[[bin]]
name = "hardener"
path = "src/main.rs"

[dependencies]
# Workspace crates
hardener-common = { path = "../hardener-common" }
hardener-compliance = { path = "../hardener-compliance" }
hardener-core = { path = "../hardener-core" }
hardener-distro = { path = "../hardener-distro" }
hardener-plugins = { path = "../hardener-plugins" }
hardener-scheduler = { path = "../hardener-scheduler" }
hardener-state = { path = "../hardener-state" }
hardener-types = { workspace = true }

# CLI
clap = { version = "4.5.53", features = ["derive", "color", "env"] }

# Async runtime
futures = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync"] }

# Output formatting
colored = "3.0.0"
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }

# Error handling
anyhow = { workspace = true }
nix = { workspace = true }

# Utilities
chrono = { workspace = true }
dirs = { workspace = true }

# Interactive prompts
dialoguer = { version = "0.12.0", features = ["fuzzy-select"]}

# SSH
openssh = "0.11.5"

# Logging
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
async-trait = { workspace = true }
# The mock executor the suite injects, feature-gated in the crates that
# define it so release builds never carry it.
hardener-core = { path = "../hardener-core", features = ["test-support"] }
