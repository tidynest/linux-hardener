[package]
name = "hardener-plugins"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
hardener-common = { path = "../hardener-common" }
hardener-core   = { path = "../hardener-core" }
hardener-types  = { workspace = true }
nix = { workspace = true, features = ["fs"] }
tokio = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
hardener-state = { path = "../hardener-state" }
tempfile = { workspace = true }
# The mock executor the suite injects, feature-gated in the crates that
# define it so release builds never carry it.
hardener-core = { path = "../hardener-core", features = ["test-support"] }
