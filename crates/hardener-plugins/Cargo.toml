[package]
name = "hardener-plugins"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# `fuzzing` is set by cargo-fuzz for every crate in its build graph, and the
# crate's fuzz-seam module compiles only under it. Declaring it here keeps
# `unexpected_cfgs` strict about every other name while accepting this one.
[lints.rust]
unexpected_cfgs = { level = "deny", check-cfg = ['cfg(fuzzing)'] }

[dependencies]
hardener-common = { path = "../hardener-common" }
hardener-core   = { path = "../hardener-core" }
hardener-types  = { workspace = true }
nix = { workspace = true, features = ["fs"] }
tokio = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
hardener-state = { path = "../hardener-state" }
tempfile = { workspace = true }
# The mock executor the suite injects, feature-gated in the crates that
# define it so release builds never carry it.
hardener-core = { path = "../hardener-core", features = ["test-support"] }
