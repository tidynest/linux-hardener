[package]
name = "hardener-ui"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Leptos framework for reactive UI
leptos = { version = "0.8.14", features = ["csr"] }
leptos_router = { version = "0.8.10" }

# Serialisation
serde = { workspace = true }
serde_json = { workspace = true }
serde-wasm-bindgen = { workspace = true }

# Backend type dependencies (without system-specific features for WASM)
hardener-core = { path = "../hardener-core", default-features = false }
hardener-common = { path = "../hardener-common" }
hardener-compliance = { path = "../hardener-compliance" }

# Tauri bindings for WASM
wasm-bindgen = "0.2.105"
wasm-bindgen-futures = "0.4.55"
js-sys = "0.3.82"

# WASM-compatible logging
tracing = { workspace = true }
