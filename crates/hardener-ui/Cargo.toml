[package]
name = "hardener-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# fonts/ holds Martian Mono and IBM Plex Sans under the SIL OFL 1.1, with
# their licence texts beside them. Trunk copies all of it into dist/.
license = "Apache-2.0 AND OFL-1.1"
build = "../../scripts/build_identity.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Leptos framework for reactive UI
leptos = { version = "0.8.14", features = ["csr"] }
leptos_router = { version = "0.8.10" }

# Serialisation
serde = { workspace = true }
serde_json = { workspace = true }
serde-wasm-bindgen = { workspace = true }

# Shared types only - WASM compatible (no system dependencies)
hardener-types = { workspace = true }

# Tauri bindings for WASM
js-sys = "0.3.83"
wasm-bindgen = "0.2.106"
wasm-bindgen-futures = "0.4.56"
web-sys = { version = "0.3.83", features = [
    "Window", "Document", "HtmlElement", "Storage",
    "KeyboardEvent", "EventTarget", "Element",
    "ScrollToOptions", "ScrollBehavior",
    "Navigator", "Clipboard",
    "HtmlSelectElement",
] }
