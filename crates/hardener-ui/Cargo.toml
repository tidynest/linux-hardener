[package]
name = "hardener-ui"
version = "0.1.0"
edition = "2024"

[dependencies]
# Leptos framework for reactive UI
leptos = { version = "0.8.13", features = ["csr"] }
leptos_router = { version = "0.8.10" }

# Our crates
hardener-core = { path = "../hardener-core" }
hardener-common = { path = "../hardener-common" }

# Serialisation
serde = { workspace = true }
serde_json = { workspace = true }
serde-wasm-bindgen = { workspace = true }

# Async runtime
tokio = { workspace = true }

# Logging
tracing = { workspace = true }

# Tauri bindings for WASM
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
