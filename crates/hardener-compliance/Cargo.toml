[package]
name = "hardener-compliance"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
chrono = { workspace = true, features = ["serde"] }
clap = { workspace = true }
hardener-common = { workspace = true }
hardener-core = { workspace = true, default-features = false }
hardener-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# PDF generation is native-only (not WASM compatible)
krilla = { version = "0.5.0", optional = true }

[dev-dependencies]
# Test-only, no cycle: hardener-plugins depends on common/core alone, never on
# this crate. Lets the profile tables be pinned against the live coverage set.
hardener-plugins = { workspace = true }

[features]
default = ["pdf"]
pdf = ["krilla"]