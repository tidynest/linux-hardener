[package]
name = "hardener-compliance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# src/fonts/ holds Noto Sans, which the PDF formatter embeds, under the SIL
# OFL 1.1. Its text is src/fonts/LICENSE-noto-sans.txt.
license = "Apache-2.0 AND OFL-1.1"

[dependencies]
chrono = { workspace = true, features = ["serde"] }
clap = { workspace = true }
hardener-common = { workspace = true }
hardener-core = { workspace = true, default-features = false }
hardener-distro = { workspace = true }
hardener-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# PDF generation is native-only (not WASM compatible)
krilla = { version = "0.5.0", optional = true }

[dev-dependencies]
# Test-only, no cycle: hardener-plugins depends on common/core alone, never on
# this crate. Lets the profile tables be pinned against the live coverage set.
hardener-plugins = { workspace = true }

[features]
default = ["pdf"]
pdf = ["krilla"]