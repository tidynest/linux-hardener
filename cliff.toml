# git-cliff configuration for automated changelog generation
# Install: cargo install git-cliff
# Usage: git-cliff --output CHANGELOG.md

[changelog]
# Changelog header
header = """
# Changelog

All notable changes to Linux System Hardener will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""

# Template for changelog body
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
            {{ commit.message | upper_first }}\
            {% if commit.breaking %} [**BREAKING**]{% endif %}\
    {% endfor %}
{% endfor %}\n
"""

# Template for changelog footer
footer = """
---

## Version History

{% for release in releases -%}
    {% if release.version -%}
        - [{{ release.version | trim_start_matches(pat="v") }}](https://github.com/tidynest/linux-system-hardener/releases/tag/{{ release.version }})
    {% endif -%}
{% endfor %}
"""

# Remove leading and trailing whitespace from changelog
trim = true

# Postprocessors for cleaning up output
postprocessors = [
    { pattern = '<REPO>', replace = "https://github.com/tidynest/linux-system-hardener" },
]

[git]
# Parse conventional commits
conventional_commits = true

# Filter commits by pattern
filter_unconventional = true

# Process each line of commit message separately
split_commits = false

# Commit preprocessors
commit_preprocessors = [
    # Remove issue numbers from commit messages for cleaner output
    { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "" },
]

# Commit parsers for conventional commits
commit_parsers = [
    { message = "^feat", group = "Added" },
    { message = "^fix", group = "Fixed" },
    { message = "^doc", group = "Documentation" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Changed" },
    { message = "^style", group = "Styling" },
    { message = "^test", group = "Testing" },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore\\(deps\\)", skip = true },
    { message = "^chore\\(pr\\)", skip = true },
    { message = "^chore\\(pull\\)", skip = true },
    { message = "^chore", group = "Miscellaneous" },
    { message = "^ci", group = "CI/CD" },
    { message = "^build", group = "Build" },
    { message = "^security", group = "Security" },
    { body = ".*security", group = "Security" },
]

# Protect breaking changes from being skipped
protect_breaking_commits = true

# Filter commits to include
filter_commits = false

# Tag pattern for releases
tag_pattern = "v[0-9].*"

# Skip tags matching this pattern
skip_tags = ""

# Ignore tags matching this pattern
ignore_tags = ""

# Sort commits by date (newest first)
topo_order = false

# Sort commits by date
sort_commits = "oldest"

# Limit the number of commits per release
# limit_commits = 42
