<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 472 96" role="img" aria-labelledby="lsh-logo-title">
  <title id="lsh-logo-title">Linux Hardener</title>
  <!-- Wordmark, light backgrounds. Palette: base #0f3d3e (deep teal), accent #14b8a6. -->
  <g>
    <!-- Shield glyph -->
    <path d="M40 10 L68 20 V42 C68 61 56.5 74.5 40 84 C23.5 74.5 12 61 12 42 V20 Z"
          fill="#0f3d3e"/>
    <path d="M29 45 l8 9 l16 -19" fill="none" stroke="#14b8a6"
          stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Wordmark -->
    <text x="92" y="61"
          font-family="'JetBrains Mono','Fira Code',ui-monospace,'Cascadia Code',Menlo,Consolas,monospace"
          font-size="40" font-weight="700" letter-spacing="-0.5"
          fill="#0f3d3e">Linux Hardener</text>
    <!-- Accent baseline tick, echoes the terminal cursor -->
    <rect x="92" y="72" width="120" height="5" rx="2.5" fill="#14b8a6"/>
  </g>
</svg>
