[package]
name = "linux-hardener-desktop"
version.workspace = true
description = "Linux System Hardening Desktop Application"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2.5.2", features = [] }

[dependencies]
hardener-common = { path = "../crates/hardener-common" }
hardener-core = { path = "../crates/hardener-core" }
hardener-plugins = { path = "../crates/hardener-plugins" }
hardener-state = { path = "../crates/hardener-state" }
hardener-compliance = { path = "../crates/hardener-compliance" }
hardener-distro = { workspace = true }
hardener-scheduler = { workspace = true }
hardener-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2.11.1", features = [] }
tauri-plugin-dialog = "2"
toml = { workspace = true }
toml_edit = "0.22"
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
hostname = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
tauri = { version = "2.11.1", features = ["test"] }
tempfile = { workspace = true }
# The command suites inject the mock executor, feature-gated where it is
# defined so release builds never carry it.
hardener-core = { path = "../crates/hardener-core", features = ["test-support"] }
