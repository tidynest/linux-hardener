[package]
name = "hardener-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
hardener-common = { path = "../crates/hardener-common" }
# For the parser targets: the seams compile only under cargo-fuzz's
# `--cfg fuzzing`, which this crate's builds always carry.
hardener-plugins = { path = "../crates/hardener-plugins" }
# For ChangeType, read in the pam target's assertions.
hardener-core = { path = "../crates/hardener-core" }

# Detached from the root workspace deliberately: cargo-fuzz builds with
# nightly sanitizer flags the workspace's release profile (LTO, strip) has
# no business inheriting, and the targets are not part of any shipped
# artefact. `cargo fuzz run <target>` from this directory.
[workspace]

[[bin]]
name = "config_directives"
path = "fuzz_targets/config_directives.rs"
test = false
doc = false
bench = false

[[bin]]
name = "nftables_include_line"
path = "fuzz_targets/nftables_include_line.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pam_stack_parsing"
path = "fuzz_targets/pam_stack_parsing.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ssh_include_resolution"
path = "fuzz_targets/ssh_include_resolution.rs"
test = false
doc = false
bench = false

[[bin]]
name = "vendor_path_for"
path = "fuzz_targets/vendor_path_for.rs"
test = false
doc = false
bench = false
